<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#212529" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#ecebe6" media="(prefers-color-scheme: light)" />
		<meta name="color-scheme" content="dark light" />
		<title>Calculadora de Zonas de Potencia</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@500;700&family=Urbanist:wght@400;500;600;700&display=swap"
		/>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main class="container">
			<header class="encabezado">
				<p class="marca">losqq · ciclismo</p>
				<h1>Zonas de potencia</h1>
			</header>

			<form id="formFtp" class="entrada" novalidate>
				<label for="ftp">Tu FTP</label>
				<div class="campo">
					<input
						type="number"
						id="ftp"
						inputmode="numeric"
						min="1"
						placeholder="200"
						autocomplete="off"
					/>
					<span class="unidad">W</span>
				</div>
				<p id="error" class="error" role="alert" hidden>Ingresa un FTP válido, mayor que 0.</p>
				<button type="submit">Calcular</button>
			</form>

			<section id="resultado" class="resultado" hidden>
				<ul id="tablaZonas" class="zonas"></ul>
			</section>
		</main>

		<script src="script.js"></script>
	</body>
</html>
